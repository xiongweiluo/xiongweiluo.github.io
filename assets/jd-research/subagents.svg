<svg xmlns="http://www.w3.org/2000/svg" width="320" height="290" viewBox="0 0 320 290" role="img" aria-label="The lead retains context while task-scoped subagents return results for review and are replaced for new tasks."><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8293aa" stroke-width="1.4"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:13px;fill:#43536b}.small{font-size:11px;fill:#6c7b90}.label{font-size:12px;fill:#536b93}.line{fill:none;stroke:#94a3b9;stroke-width:1.3;marker-end:url(#arrow)}.node{fill:white;stroke:#dbe2ec;stroke-width:1.2}.active{fill:#e9effa;stroke:#b7c7e4;stroke-width:1.2}</style><rect x="70" y="16" width="180" height="40" rx="8" class="active"/><text x="160.0" y="40.0" text-anchor="middle">Lead · keeps context</text><path d="M160 56V83H55M160 83H265" fill="none" stroke="#94a3b9" stroke-width="1.3"/><path d="M55 83V104" class="line"/><path d="M160 83V104" class="line"/><path d="M265 83V104" class="line"/><rect x="12" y="110" width="86" height="57" rx="8" fill="white" stroke="#aebed4" stroke-dasharray="4 3"/><text x="55" y="134" text-anchor="middle">Task A</text><text x="55" y="153" text-anchor="middle" class="small">subagent</text><rect x="117" y="110" width="86" height="57" rx="8" fill="white" stroke="#aebed4" stroke-dasharray="4 3"/><text x="160" y="134" text-anchor="middle">Task B</text><text x="160" y="153" text-anchor="middle" class="small">subagent</text><rect x="222" y="110" width="86" height="57" rx="8" fill="white" stroke="#aebed4" stroke-dasharray="4 3"/><text x="265" y="134" text-anchor="middle">Task C</text><text x="265" y="153" text-anchor="middle" class="small">subagent</text><path d="M55 167V189H265V167M160 167V189" fill="none" stroke="#94a3b9" stroke-width="1.3"/><path d="M160 189V209" class="line"/><rect x="70" y="215" width="180" height="40" rx="8" class="node"/><text x="160.0" y="239.0" text-anchor="middle">Results → review</text><text x="160" y="280" text-anchor="middle" class="small">New task → fresh worker context</text></svg>